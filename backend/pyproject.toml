[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webguard"
version = "0.1.0"
description = "Automated Web Security Assessment & Misconfiguration Scanner"
license = "MIT"
requires-python = ">=3.12"
authors = [
    {name = "WebGuard Team"},
]
keywords = ["security", "scanner", "web", "audit", "vulnerability"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "jinja2>=3.1.4",
    "sse-starlette>=2.1.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "black>=24.8.0",
    "mypy>=1.11.0",
    "pip-audit>=2.7.0",
    "pre-commit>=3.8.0",
    "httpx[http2]>=0.27.0",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["app"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by black)
    "S101",   # assert usage (needed for tests)
    "B008",   # FastAPI's DI idiom (`db: Session = Depends(get_db)`) relies on a function
              # call as the default value — this is the framework's documented pattern,
              # not the mutable-default-argument bug this rule normally catches.
    "UP042",  # `class Foo(str, Enum)` is intentional, not a migration-pending StrEnum:
              # it predates 3.11's StrEnum, is well understood, and every status/severity
              # enum here is covered by tests — not worth the churn of switching.
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",  # assert usage (needed for tests)
    "T20",   # print() usage
    "S603",  # subprocess call in test_ssl_tls_legacy.py — spawns the local `openssl` CLI
    "S607",  # to generate a throwaway test certificate; not untrusted/external input
]

[tool.black]
target-version = ["py312"]
line-length = 88

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests (network-bound)",
]
