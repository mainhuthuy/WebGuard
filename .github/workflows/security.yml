name: Security scan

# Scans WebGuard's own supply chain: Python dependencies (pip-audit), npm dependencies
# (npm audit) and the built Docker images (Trivy). Besides PRs/pushes it runs weekly,
# because new CVEs get published against dependencies that haven't changed at all.
on:
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/security.yml"
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pip-audit:
    name: Python deps (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install pip-audit
        run: pip install pip-audit

      # `pip-audit .` audits the project's *runtime* dependencies declared in pyproject.toml
      # (not the [dev] extras) — those are what actually ships in the image.
      - name: Audit backend dependencies
        run: pip-audit .
        working-directory: backend

  npm-audit:
    name: npm deps (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # --omit=dev: only what ends up in the production bundle. Dev tooling (vite, eslint,
      # vitest...) never runs in front of a user, so its advisories shouldn't block a PR.
      # High+ only, to avoid red builds over low-severity noise.
      - name: Audit frontend dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  trivy:
    name: Image scan (Trivy) - ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            target: ""
          - name: frontend
            context: frontend
            target: production
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (local only, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          load: true
          tags: webguard-${{ matrix.name }}:scan
          cache-from: type=gha,scope=${{ matrix.name }}

      # Fails the job on HIGH/CRITICAL findings that have a fix available. `ignore-unfixed`
      # keeps the gate actionable: you can't patch a CVE nobody has patched yet.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: webguard-${{ matrix.name }}:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
