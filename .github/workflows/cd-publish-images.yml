name: CD - Publish images

# Builds the backend and frontend (production target) images and pushes them to GitHub
# Container Registry. Deliberately NOT triggered by pull requests: a PR (especially from a
# fork) must never publish anything. CI (backend-ci / frontend-ci) is what gates PRs.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

# Don't cancel an in-progress publish: half-pushed tags are worse than a queued run.
concurrency:
  group: cd-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Least privilege: the default GITHUB_TOKEN only gets what this job needs.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            target: ""
          - name: frontend
            context: frontend
            # Without this the LAST Dockerfile stage (`dev`, the Vite dev server) is built.
            target: production
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Computes tags + OCI labels. GHCR requires lowercase names; this action lowercases
      # the image name for us (github.repository may contain uppercase, e.g. "WebGuard").
      #   push to main  -> :main, :sha-<short>
      #   tag v1.2.3    -> :1.2.3, :1.2, :latest
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # Gate: build locally first and scan it, so an image with a fixable HIGH/CRITICAL
      # vulnerability never reaches the registry. The push step below reuses these layers
      # from the build cache, so this costs a scan, not a second build.
      - name: Build image for scanning (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          load: true
          tags: webguard-${{ matrix.name }}:scan
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: webguard-${{ matrix.name }}:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
