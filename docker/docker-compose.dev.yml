# See docker-compose.yml for why this needs its own explicit project name.
name: webguard-dev
services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - WEBGUARD_ENV=development
      - WEBGUARD_DEBUG=true
      # Must live under /app/data — see docker-compose.yml for why
      - WEBGUARD_DB_URL=sqlite:////app/data/webguard.db
    volumes:
      - ../backend/app:/app/app
      - backend_data:/app/data
    command: python -m uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ../frontend/src:/app/src
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
