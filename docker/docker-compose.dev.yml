services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - WEBGUARD_ENV=development
      - WEBGUARD_DEBUG=true
      - WEBGUARD_DB_URL=sqlite:///./webguard.db
    volumes:
      - ../backend/app:/app/app
      - backend_data:/app/data
    command: python -m uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ../frontend/src:/app/src
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
