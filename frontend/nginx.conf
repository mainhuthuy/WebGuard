server {
    # >1024 so nginx can run fully unprivileged inside the container (see Dockerfile).
    listen 8080;
    server_name localhost;

    # Don't advertise the nginx version — same reason WebGuard's own InformationModule
    # flags a `Server` header that reveals software/version as a finding.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript
               application/xml text/xml image/svg+xml;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # index.html must always be revalidated — it references the current build's
        # hashed asset filenames, and a stale cached copy would ask for files a new
        # deploy already deleted.
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # Vite's hashed build output (index-<hash>.js / .css): the filename changes whenever
    # the content does, so caching it "forever" is safe — a new deploy is a new filename,
    # never a silently-updated one.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Server-Sent Events: scan progress must not be buffered or cut off
    location ~ ^/api/v1/scan/[^/]+/stream$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
