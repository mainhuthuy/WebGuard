# Security headers for the checks WebGuard's own HeadersModule looks for (see
# backend/app/modules/headers.py / docs/learning/1.2) — this app practices what it scans for.
#
# Included (not placed at server{} level) because nginx's `add_header` does NOT inherit into
# a location{} block that defines its own `add_header` (e.g. Cache-Control below) — a
# server-level add_header would be silently dropped on exactly those locations otherwise.
#
# Script/style are 'self'-only: the build has no inline <script>, and React's style={{}} prop
# sets CSSOM properties via JS rather than an HTML style="" attribute, so it isn't affected by
# style-src's inline restriction. Google Fonts is the one deliberate external source.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HSTS is deliberately NOT set here: this nginx serves plain HTTP inside the compose network.
# Whoever terminates real TLS in front of it (a cloud load balancer, a reverse proxy) is the
# right place to add Strict-Transport-Security.
